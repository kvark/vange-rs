<text x="202.0" y="212.0" class="value" text-anchor="end" >low</text>
<rect x="73" y="237" width="139" height="38" rx="5" fill="#168c9e" opacity="0.2"/>
<text x="83.0" y="253.0" class="axis" text-anchor="start" >delta bits</text>
<text x="202.0" y="264.0" class="value" text-anchor="end" >part of mid</text>
<rect x="73" y="289" width="139" height="38" rx="5" fill="#168c9e" opacity="0.24"/>
<text x="83.0" y="305.0" class="axis" text-anchor="start" >material</text>
<text x="202.0" y="316.0" class="value" text-anchor="end" >surface type</text>
<rect x="265" y="130" width="175" height="230" rx="12" fill="white" stroke="#8b62c6" stroke-width="3"/>
