<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-label="Vangers dual-layer terrain encoding">
<style>text{font-family:Inter,DejaVu Sans,sans-serif;fill:#20252b}.title{font-size:23px;font-weight:700}.subtitle{font-size:13px;fill:#68717b}.panel-title{font-size:15px;font-weight:700}.axis{font-size:11px;fill:#68717b}.label{font-size:12px}.value{font-size:10px;font-weight:700}.light{fill:#f8fafc}</style>
<rect width="1080" height="500" fill="#fbfaf7" rx="14"/>
<text x="34.0" y="38.0" class="title" text-anchor="start" >Two texels encode two vertical solids</text>
<text x="34.0" y="61.0" class="subtitle" text-anchor="start" >The compact simulation state stores a floor, a cave ceiling, and a slab top</text>
<text x="160.0" y="104.0" class="panel-title" text-anchor="middle" >paired source samples</text>
<rect x="55" y="130" width="175" height="230" rx="12" fill="white" stroke="#168c9e" stroke-width="3"/>
