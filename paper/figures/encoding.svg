<rect x="283" y="185" width="139" height="38" rx="5" fill="#8b62c6" opacity="0.16"/>
<text x="293.0" y="201.0" class="axis" text-anchor="start" >height byte</text>
<text x="412.0" y="212.0" class="value" text-anchor="end" >high</text>
<rect x="283" y="237" width="139" height="38" rx="5" fill="#8b62c6" opacity="0.2"/>
<text x="293.0" y="253.0" class="axis" text-anchor="start" >delta bits</text>
<text x="412.0" y="264.0" class="value" text-anchor="end" >part of mid</text>
<rect x="283" y="289" width="139" height="38" rx="5" fill="#8b62c6" opacity="0.24"/>
<text x="293.0" y="305.0" class="axis" text-anchor="start" >material</text>
<text x="412.0" y="316.0" class="value" text-anchor="end" >surface type</text>
<path d="M 440 244 C 485 244, 500 244, 545 244" fill="none" stroke="#68717b" stroke-width="3" marker-end="url(#arrow)"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#68717b"/></marker></defs>
<text x="492.0" y="224.0" class="axis" text-anchor="middle" >decode</text>
<text x="790.0" y="104.0" class="panel-title" text-anchor="middle" >one vertical terrain column</text>
<rect x="660" y="130" width="265" height="275" rx="10" fill="#e7f0f7" stroke="#d9dde1"/>
<rect x="660" y="315" width="265" height="90" fill="#776858"/>
<rect x="660" y="175" width="265" height="58" fill="#8d8171"/>
<rect x="660" y="233" width="265" height="82" fill="#283643"/>
<line x1="642" y1="175" x2="943" y2="175" stroke="#8b62c6" stroke-width="3"/>
