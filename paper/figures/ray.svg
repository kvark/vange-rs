<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" font-family="Arial, Helvetica, sans-serif">
  <rect width="700" height="460" fill="#ffffff"/>
  <!-- altitude grid -->
  <g stroke="#eeeeee" stroke-width="1">
    <line x1="0" y1="80"  x2="700" y2="80"/>
    <line x1="0" y1="140" x2="700" y2="140"/>
    <line x1="0" y1="200" x2="700" y2="200"/>
    <line x1="0" y1="260" x2="700" y2="260"/>
    <line x1="0" y1="320" x2="700" y2="320"/>
    <line x1="0" y1="380" x2="700" y2="380"/>
  </g>

  <!-- height field -->
  <path d="M0,400 L30,392 L70,372 L110,358 L150,350 L190,340 L230,322 L270,312 L310,330 L350,362 L390,388 L430,392 L470,372 L510,342 L550,325 L590,340 L630,355 L670,352 L700,346 L700,460 L0,460 Z"
        fill="#e7c9a3" stroke="#b98a5a" stroke-width="2"/>

  <!-- camera -->
  <g transform="translate(80,70)">
    <rect x="0" y="4" width="30" height="24" rx="3" fill="#d9d9d9" stroke="#333" stroke-width="2"/>
    <circle cx="46" cy="16" r="7" fill="#333"/>
  </g>

  <!-- ray: camera (95,95) to hit (430,390) -->
  <line x1="95" y1="95" x2="430" y2="390" stroke="#3b5ba5" stroke-width="2.5"/>
  <!-- step samples along the ray -->
  <g stroke="#3b5ba5" stroke-width="2">
    <line x1="150" y1="144" x2="167" y2="151"/>
    <line x1="208" y1="195" x2="223" y2="205"/>
    <line x1="266" y1="246" x2="278" y2="258"/>
    <line x1="323" y1="298" x2="331" y2="312"/>
    <line x1="374" y1="344" x2="379" y2="359"/>
  </g>

  <!-- bracket a (above) / b (crossing) -->
  <g stroke="#c0392b" stroke-width="2">
    <line x1="330" y1="364" x2="338" y2="350"/>
    <line x1="330" y1="364" x2="282" y2="364"/>
    <line x1="430" y1="390" x2="452" y2="390"/>
  </g>
  <text x="268" y="358" font-size="14" fill="#c0392b">a</text>
  <text x="458" y="386" font-size="14" fill="#c0392b">b</text>

  <!-- bisection samples converging on the hit -->
  <g fill="#3b5ba5">
    <circle cx="390" cy="370" r="3.5"/>
    <circle cx="410" cy="380" r="3.5"/>
    <circle cx="421" cy="385" r="3.5"/>
  </g>
  <circle cx="430" cy="390" r="5" fill="#c0392b"/>

  <text x="120" y="120" font-size="14" fill="#555">per-pixel ray</text>
  <text x="120" y="138" font-size="13" fill="#888">16 fixed steps, then 4 bisections</text>
  <text x="430" y="426" font-size="14" fill="#555">first crossing</text>
  <text x="240" y="432" font-size="13" fill="#888">dual layer: re-emerge past the slab&#8217;s far edge</text>
</svg>
