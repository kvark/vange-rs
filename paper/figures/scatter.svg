<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Compute scattering</title>
  <desc id="desc">A camera-warped footprint places many point samples nearby and fewer far away. Projected samples contend through atomic minimum depth writes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e76f51"/></marker>
    <style>.ink{stroke:#24324a;stroke-width:2;fill:none}.guide{stroke:#d9e0e8;stroke-width:1.5;fill:none}.label{font:14px system-ui,sans-serif;fill:#24324a}.small{font:12px system-ui,sans-serif;fill:#5f6b7a}.accent{stroke:#e76f51;stroke-width:3;fill:none}</style>
  </defs>
  <rect width="760" height="360" fill="#fff"/><rect x="24" y="22" width="122" height="25" rx="12" fill="#edf6f1"/><text x="85" y="39" text-anchor="middle" class="small">OBJECT ORDER</text>
  <circle cx="95" cy="287" r="10" fill="#24324a"/><path d="M105 278L137 250" class="ink"/><path d="M115 267L305 67L495 267Z" fill="#f5f7fa" stroke="#24324a" stroke-width="2"/>
  <g class="guide"><path d="M141 240H469"/><path d="M160 214H450"/><path d="M185 181H425"/><path d="M218 146H392"/><path d="M256 106H354"/><path d="M160 214L305 67M218 146L305 67M392 146L305 67M450 214L305 67"/></g>
  <g fill="#49a078"><circle cx="151" cy="240" r="4"/><circle cx="178" cy="240" r="4"/><circle cx="205" cy="240" r="4"/><circle cx="232" cy="240" r="4"/><circle cx="259" cy="240" r="4"/><circle cx="286" cy="240" r="4"/><circle cx="313" cy="240" r="4"/><circle cx="340" cy="240" r="4"/><circle cx="367" cy="240" r="4"/><circle cx="394" cy="240" r="4"/><circle cx="421" cy="240" r="4"/><circle cx="448" cy="240" r="4"/><circle cx="173" cy="214" r="4"/><circle cx="213" cy="214" r="4"/><circle cx="253" cy="214" r="4"/><circle cx="293" cy="214" r="4"/><circle cx="333" cy="214" r="4"/><circle cx="373" cy="214" r="4"/><circle cx="413" cy="214" r="4"/><circle cx="203" cy="181" r="4"/><circle cx="263" cy="181" r="4"/><circle cx="323" cy="181" r="4"/><circle cx="383" cy="181" r="4"/><circle cx="240" cy="146" r="4"/><circle cx="305" cy="146" r="4"/><circle cx="370" cy="146" r="4"/><circle cx="274" cy="106" r="4"/><circle cx="336" cy="106" r="4"/></g>
  <text x="151" y="270" class="label">dense near</text><text x="302" y="92" class="label">sparse far</text><text x="205" y="322" class="small">camera-aligned, warped sampling footprint</text>
  <path d="M371 146L563 118" class="accent" marker-end="url(#arrow)"/><path d="M333 214L563 153" class="accent" marker-end="url(#arrow)"/><path d="M394 240L563 188" class="accent" marker-end="url(#arrow)"/>
  <g transform="translate(575 72)"><rect width="130" height="190" rx="5" fill="#f5f7fa" stroke="#24324a" stroke-width="2"/><g stroke="#d9e0e8"><path d="M26 0V190M52 0V190M78 0V190M104 0V190M0 32H130M0 64H130M0 96H130M0 128H130M0 160H130"/></g><g fill="#49a078"><circle cx="65" cy="48" r="8"/><circle cx="66" cy="112" r="8"/><circle cx="91" cy="145" r="8"/></g><circle cx="65" cy="48" r="4" fill="#e76f51"/><rect x="52" y="96" width="26" height="32" fill="#e76f51" opacity=".18" stroke="#e76f51" stroke-width="2"/></g>
  <text x="640" y="286" text-anchor="middle" class="label">atomicMin(depth | type)</text><text x="640" y="306" text-anchor="middle" class="small">nearest sample wins</text><text x="640" y="328" text-anchor="middle" class="small">unhit pixels become holes</text>
</svg>
