<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" role="img" aria-label="The seven measured terrain configurations at the hangar horizon scene">
<style>text{font-family:Inter,DejaVu Sans,sans-serif;fill:#20252b}.title{font-size:23px;font-weight:700}.subtitle{font-size:13px;fill:#68717b}.panel-title{font-size:15px;font-weight:700}.axis{font-size:11px;fill:#68717b}.label{font-size:12px}.value{font-size:10px;font-weight:700}.light{fill:#f8fafc}</style>
<rect width="1240" height="650" fill="#fbfaf7" rx="14"/>
<text x="34.0" y="38.0" class="title" text-anchor="start" >One horizon scene exposes seven different tradeoffs</text>
<text x="34.0" y="61.0" class="subtitle" text-anchor="start" >Hangar · pitch 0° · identical camera, lighting, fog, and shadow pass</text>
<rect x="20" y="75" width="290" height="245" rx="8" fill="white" stroke="#168c9e" stroke-width="2"/>
<text x="165.0" y="95.0" class="panel-title" text-anchor="middle" >RayTraced</text>
<image href="teaser-0.png" x="25" y="105" width="280" height="175" preserveAspectRatio="xMidYMid slice"/>
<text x="165.0" y="307.0" class="axis" text-anchor="middle" >image-order</text>
<rect x="322" y="75" width="290" height="245" rx="8" fill="white" stroke="#4776c5" stroke-width="2"/>
<text x="467.0" y="95.0" class="panel-title" text-anchor="middle" >RayVoxel</text>
<image href="teaser-1.png" x="327" y="105" width="280" height="175" preserveAspectRatio="xMidYMid slice"/>
<text x="467.0" y="307.0" class="axis" text-anchor="middle" >image-order</text>
<rect x="624" y="75" width="290" height="245" rx="8" fill="white" stroke="#d99125" stroke-width="2"/>
<text x="769.0" y="95.0" class="panel-title" text-anchor="middle" >Sliced</text>
<image href="teaser-2.png" x="629" y="105" width="280" height="175" preserveAspectRatio="xMidYMid slice"/>
<text x="769.0" y="307.0" class="axis" text-anchor="middle" >forward samples</text>
<rect x="926" y="75" width="290" height="245" rx="8" fill="white" stroke="#d65757" stroke-width="2"/>
<text x="1071.0" y="95.0" class="panel-title" text-anchor="middle" >Scattered</text>
<image href="teaser-3.png" x="931" y="105" width="280" height="175" preserveAspectRatio="xMidYMid slice"/>
<text x="1071.0" y="307.0" class="axis" text-anchor="middle" >forward samples</text>
<rect x="171" y="335" width="290" height="245" rx="8" fill="white" stroke="#8b62c6" stroke-width="2"/>
<text x="316.0" y="355.0" class="panel-title" text-anchor="middle" >Painter</text>
<image href="teaser-4.png" x="176" y="365" width="280" height="175" preserveAspectRatio="xMidYMid slice"/>
<text x="316.0" y="567.0" class="axis" text-anchor="middle" >forward samples</text>
<rect x="473" y="335" width="290" height="245" rx="8" fill="white" stroke="#69a879" stroke-width="2"/>
<text x="618.0" y="355.0" class="panel-title" text-anchor="middle" >Mesh q=0.0</text>
<image href="teaser-5.png" x="478" y="365" width="280" height="175" preserveAspectRatio="xMidYMid slice"/>
<text x="618.0" y="567.0" class="axis" text-anchor="middle" >fitted triangles</text>
<rect x="775" y="335" width="290" height="245" rx="8" fill="white" stroke="#24764a" stroke-width="2"/>
<text x="920.0" y="355.0" class="panel-title" text-anchor="middle" >Mesh q=0.75</text>
<image href="teaser-6.png" x="780" y="365" width="280" height="175" preserveAspectRatio="xMidYMid slice"/>
