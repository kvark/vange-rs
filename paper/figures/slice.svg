<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" font-family="Arial, Helvetica, sans-serif">
  <rect width="700" height="460" fill="#ffffff"/>

  <text x="20" y="34" font-size="14" fill="#555">one horizontal quad per slice, drawn full-screen, instanced</text>
  <text x="20" y="52" font-size="13" fill="#888">a fragment keeps itself only where the slice lies inside the solid column</text>

  <!-- the terrain column -->
  <rect x="250" y="300" width="200" height="130" fill="#e7c9a3" stroke="#b98a5a" stroke-width="2"/>
  <rect x="250" y="120" width="200" height="90"  fill="#e7c9a3" stroke="#b98a5a" stroke-width="2"/>
  <g stroke="#b98a5a" stroke-width="1.5" stroke-dasharray="5,4">
    <line x1="250" y1="300" x2="250" y2="210"/>
    <line x1="450" y1="300" x2="450" y2="210"/>
  </g>

  <!-- level annotations -->
  <g font-size="13" fill="#333">
    <line x1="470" y1="120" x2="500" y2="120" stroke="#333" stroke-width="1.5"/>
    <text x="505" y="124">slab top (high)</text>
    <line x1="470" y1="210" x2="500" y2="210" stroke="#333" stroke-width="1.5"/>
    <text x="505" y="214">cave ceiling (mid)</text>
    <line x1="470" y1="300" x2="500" y2="300" stroke="#333" stroke-width="1.5"/>
    <text x="505" y="304">floor (low)</text>
  </g>
  <text x="462" y="260" font-size="13" fill="#888">cave</text>

  <!-- slices: full width, then emphasized over the column -->
  <g stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="7,5">
    <line x1="0" y1="395" x2="700" y2="395"/>
    <line x1="0" y1="330" x2="700" y2="330"/>
    <line x1="0" y1="255" x2="700" y2="255"/>
    <line x1="0" y1="175" x2="700" y2="175"/>
    <line x1="0" y1="110" x2="700" y2="110"/>
    <line x1="0" y1="55"  x2="700" y2="55"/>
  </g>

  <!-- kept spans (inside solid) -->
  <g stroke="#2e7d32" stroke-width="4">
    <line x1="250" y1="395" x2="450" y2="395"/>
    <line x1="250" y1="330" x2="450" y2="330"/>
    <line x1="250" y1="175" x2="450" y2="175"/>
  </g>

  <!-- discarded spans (cave or sky) -->
  <g stroke="#c0392b" stroke-width="4" stroke-dasharray="2,6">
    <line x1="250" y1="255" x2="450" y2="255"/>
    <line x1="250" y1="110" x2="450" y2="110"/>
    <line x1="250" y1="55"  x2="450" y2="55"/>
  </g>

  <g font-size="13" fill="#2e7d32">
    <text x="214" y="398">kept</text>
  </g>
  <g font-size="13" fill="#c0392b">
    <text x="196" y="258">discard</text>
  </g>
</svg>
