<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" font-family="Arial, Helvetica, sans-serif">
  <rect width="700" height="460" fill="#ffffff"/>

  <!-- ground -->
  <rect x="0" y="400" width="700" height="60" fill="#efe6d8" stroke="#b98a5a" stroke-width="2"/>

  <!-- neighbouring single-level samples -->
  <g fill="#d9d2c8" stroke="#b98a5a" stroke-width="1.5">
    <rect x="120" y="340" width="30" height="60"/>
    <rect x="500" y="320" width="30" height="80"/>
    <rect x="610" y="350" width="30" height="50"/>
  </g>

  <!-- highlighted double-level sample: floor bar -->
  <rect x="300" y="260" width="60" height="140" fill="#e7c9a3" stroke="#b98a5a" stroke-width="2"/>
  <rect x="352" y="260" width="8" height="140" fill="#cfa87c" stroke="#b98a5a" stroke-width="1.5"/>
  <!-- cave gap -->
  <g stroke="#b98a5a" stroke-width="1.5" stroke-dasharray="5,4">
    <line x1="300" y1="260" x2="360" y2="260"/>
    <line x1="300" y1="180" x2="360" y2="180"/>
    <line x1="300" y1="180" x2="300" y2="260"/>
    <line x1="360" y1="180" x2="360" y2="260"/>
  </g>
  <!-- slab bar -->
  <rect x="300" y="90" width="60" height="90" fill="#d8a878" stroke="#a97f4f" stroke-width="2"/>
  <rect x="352" y="90" width="8" height="90" fill="#b98a5a" stroke="#a97f4f" stroke-width="1.5"/>

  <text x="80" y="150" font-size="14" fill="#555">one instance per ground sample in view</text>
  <text x="80" y="170" font-size="13" fill="#888">front-to-back order along the dominant camera axis</text>

  <g font-size="13" fill="#333">
    <text x="300" y="80">slab bar</text>
    <text x="300" y="312">floor bar</text>
    <text x="300" y="470">single-level sample</text>
  </g>

  <line x1="150" y1="335" x2="290" y2="335" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="118" y="330" font-size="13" fill="#c0392b">two bars only where double-level</text>
</svg>
