<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Greedy terrain triangulation</title>
  <desc id="desc">A coarse triangulation repeatedly inserts the source sample with largest vertical error, producing large triangles on flats and dense triangles at discontinuities.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e76f51"/></marker>
    <style>.ink{stroke:#24324a;stroke-width:2;fill:none}.grid{stroke:#d9e0e8;stroke-width:1;fill:none}.tri{stroke:#477aa8;stroke-width:1.7;fill:none}.label{font:14px system-ui,sans-serif;fill:#24324a}.small{font:12px system-ui,sans-serif;fill:#5f6b7a}.accent{stroke:#e76f51;stroke-width:3;fill:none}</style>
  </defs>
  <rect width="760" height="360" fill="#fff"/><rect x="24" y="22" width="116" height="25" rx="12" fill="#f7efe2"/><text x="82" y="39" text-anchor="middle" class="small">PRECOMPUTED</text>
  <g transform="translate(38 78)"><rect width="248" height="210" rx="5" fill="#f5f7fa" stroke="#24324a" stroke-width="2"/><g class="grid"><path d="M31 0V210M62 0V210M93 0V210M124 0V210M155 0V210M186 0V210M217 0V210M0 30H248M0 60H248M0 90H248M0 120H248M0 150H248M0 180H248"/></g><path d="M0 180L62 151L124 158L186 70L248 62" stroke="#9a6f2f" stroke-width="8" opacity=".35" fill="none"/><g fill="#24324a"><circle cx="0" cy="180" r="4"/><circle cx="62" cy="151" r="4"/><circle cx="124" cy="158" r="4"/><circle cx="186" cy="70" r="4"/><circle cx="248" cy="62" r="4"/></g><circle cx="155" cy="116" r="8" fill="#e76f51"/><path d="M124 158L186 70" stroke="#477aa8" stroke-width="2"/><path d="M155 116V134" stroke="#e76f51" stroke-width="3" stroke-dasharray="4 3"/><text x="86" y="205" class="small">source samples</text></g>
  <text x="162" y="68" text-anchor="middle" class="label">measure vertical error</text><text x="162" y="313" text-anchor="middle" class="label">insert worst sample</text><path d="M292 183H359" class="accent" marker-end="url(#arrow)"/><text x="325" y="169" text-anchor="middle" class="small">repeat to tolerance</text>
  <g transform="translate(382 78)"><path d="M0 210L0 145L55 151L102 124L145 131L174 74L202 110L246 61L320 68V210Z" fill="#e7c98d" opacity=".55" stroke="#9a6f2f" stroke-width="2"/><g class="tri"><path d="M0 145L55 151L102 124L145 131L174 74L202 110L246 61L320 68"/><path d="M0 210L55 151L102 210L102 124L145 210L145 131L174 210L174 74L202 210L202 110L246 210L246 61L320 210L320 68"/><path d="M55 151L102 124L145 131L174 74L202 110L246 61"/><path d="M102 124L174 74M145 131L202 110M202 110L320 68"/></g><path d="M170 74V210" stroke="#e76f51" stroke-width="4"/><g fill="#477aa8"><circle cx="0" cy="145" r="4"/><circle cx="55" cy="151" r="4"/><circle cx="102" cy="124" r="4"/><circle cx="145" cy="131" r="4"/><circle cx="174" cy="74" r="4"/><circle cx="202" cy="110" r="4"/><circle cx="246" cy="61" r="4"/><circle cx="320" cy="68" r="4"/></g></g>
  <text x="476" y="313" class="label">large triangles on flats</text><text x="560" y="53" class="label">dense at changes</text><path d="M571 58L557 98" class="accent" marker-end="url(#arrow)"/><text x="540" y="336" text-anchor="middle" class="small">shared low / mid / high topology; explicit walls close slabs</text>
</svg>
