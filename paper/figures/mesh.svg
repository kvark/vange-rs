<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" font-family="Arial, Helvetica, sans-serif">
  <rect width="700" height="460" fill="#ffffff"/>

  <text x="20" y="40" font-size="14" fill="#555">greedy insertion: repeatedly split the triangle with the largest vertical error</text>
  <text x="20" y="60" font-size="13" fill="#888">dense where the terrain changes direction, coarse on the flat</text>

  <!-- triangulated strip -->
  <g fill="#f0e6d8" stroke="#b98a5a" stroke-width="1.5">
    <polygon points="0,360 80,355 0,305"/>
    <polygon points="80,355 160,345 80,300"/>
    <polygon points="160,345 80,300 0,305"/>
    <polygon points="160,345 160,290 80,300"/>
    <polygon points="160,345 240,300 160,290"/>
    <polygon points="240,300 240,245 160,290"/>
    <polygon points="240,300 280,280 240,245"/>
    <polygon points="280,280 280,225 240,245"/>
    <polygon points="280,280 320,265 280,225"/>
    <polygon points="320,265 320,210 280,225"/>
    <polygon points="320,265 360,262 320,210"/>
    <polygon points="360,262 360,207 320,210"/>
    <polygon points="360,262 400,275 360,207"/>
    <polygon points="400,275 400,220 360,207"/>
    <polygon points="400,275 440,305 400,220"/>
    <polygon points="440,305 440,250 400,220"/>
    <polygon points="440,305 520,330 440,250"/>
    <polygon points="520,330 520,275 440,250"/>
    <polygon points="520,330 600,325 520,275"/>
    <polygon points="600,325 600,270 520,275"/>
    <polygon points="600,325 700,318 600,270"/>
    <polygon points="700,318 700,263 600,270"/>
  </g>

  <!-- vertical wall where the slab ends (the left edge of the right-hand column) -->
  <line x1="600" y1="270" x2="600" y2="325" stroke="#a97f4f" stroke-width="3.5"/>

  <!-- highlighted worst-error triangle -->
  <polygon points="320,265 360,262 320,210" fill="#f4c98a" stroke="#c0392b" stroke-width="2"/>
  <line x1="333" y1="245" x2="333" y2="263" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="333" cy="263" r="4" fill="#c0392b"/>

  <text x="250" y="240" font-size="13" fill="#c0392b">split this one</text>
  <text x="608" y="306" font-size="13" fill="#333">vertical wall</text>
  <text x="608" y="322" font-size="13" fill="#888">where the slab ends</text>
  <text x="20" y="100" font-size="13" fill="#888">one planar triangulation shared by all three altitudes; exact i64 predicates</text>
</svg>
