<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vangers &ndash; mesh terrain</title>
    <link rel="stylesheet" href="../embed.css">
</head>
<body>
    <!-- winit binds to this exact id; see `web_main` in bin/web/main.rs. -->
    <canvas id="canvas" tabindex="0"></canvas>

    <div id="loading">
        <div id="phase">starting&hellip;</div>
        <div id="bar"><div id="fill" class="indet"></div></div>
        <div id="note"></div>
    </div>

    <div id="badge">
        triangle mesh
        <span class="sep">&middot;</span> <a href="../voxel/">voxel</a> <a href="../ray/">ray</a>
    </div>

    <script type="module">
        // Which terrain renderer this page gets is decided in Rust from
        // the URL path; see `terrain_choice` in bin/web/main.rs.
        import { boot } from '../embed.js';
        boot();
    </script>
</body>
</html>
